name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs from my contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-matrix.svg?color_snake=#00ff41&color_dots=#0d1117,#003b10,#006b1f,#00a82b,#00ff41&color_dot_border=#050805&color_background=#050805
            dist/snake-light.svg?color_snake=#00a82b&color_dots=#ebedf0,#c6f6d0,#7ddc93,#2ea84f,#0b6b28

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
